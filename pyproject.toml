[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-matrix"
version = "0.1.0"
description = "Replay one GET across an identity matrix and see where the authorization (BOLA/IDOR) trust boundary breaks — triage-safe, PII-redacted evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NEO849" }]
keywords = ["bola", "idor", "authorization", "api-security", "bug-bounty", "appsec", "security", "pentesting", "iam"]
dependencies = ["requests>=2.25"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/NEO849/trust-matrix"
Repository = "https://github.com/NEO849/trust-matrix"
Issues = "https://github.com/NEO849/trust-matrix/issues"

[project.scripts]
trust-matrix = "trust_matrix:main"

[tool.setuptools]
py-modules = ["trust_matrix", "diff_core"]
