# Publish trust-matrix to PyPI via PyPI Trusted Publishing (OIDC — no API token).
#
# Flow: when a GitHub Release is published, build the sdist + wheel once, publish
# that exact build to PyPI with PEP 740 attestations, and attach the same
# artifacts to the Release. No secrets are stored anywhere; PyPI trusts this
# workflow via OIDC. See docs/RELEASING.md for the one-time PyPI setup.
#
# Action pins are commit SHAs (OpenSSF Scorecard standard); the trailing comment
# records the human-readable version. Dependabot keeps them fresh (.github/dependabot.yml).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trust-matrix
    permissions:
      id-token: write  # OIDC token that PyPI verifies for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true

  release-assets:
    name: Attach artifacts to the GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the built artifacts as Release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload artifacts to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}" dist/*
          --clobber --repo "${{ github.repository }}"
